apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ui-to-backends
  namespace: retail-app
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: retail-store-ui
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: retail-store-catalog
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: retail-store-carts